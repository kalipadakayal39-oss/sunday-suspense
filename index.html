<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sunday Suspense Audio Studio</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0d0d0d;
      color: #ffffff;
      display: flex;
      justify-content: center;
      padding: 20px;
      margin: 0;
    }
    .container {
      width: 100%;
      max-width: 550px;
      background: #181818;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(255, 71, 87, 0.2);
      border: 1px solid #2a2a2a;
    }
    h2 { text-align: center; color: #ff4757; margin-bottom: 20px; }
    label { font-weight: bold; font-size: 14px; color: #ccc; display: block; margin-top: 15px; margin-bottom: 5px; }
    textarea {
      width: 100%;
      height: 120px;
      background: #252525;
      color: #fff;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 10px;
      box-sizing: border-box;
      font-size: 15px;
      resize: vertical;
    }
    select, input[type="range"] {
      width: 100%;
      padding: 10px;
      background: #252525;
      color: #fff;
      border: 1px solid #444;
      border-radius: 6px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #ff4757;
      border: none;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 20px;
      transition: 0.3s;
    }
    button:hover { background: #e84118; }
    .audio-controls {
      margin-top: 20px;
      background: #222;
      padding: 15px;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>🎭 Sunday Suspense Audio Studio</h2>
    
    <label for="scriptText">১. আপনার গল্প বা ডায়ালগ লিখুন:</label>
    <textarea id="scriptText" placeholder="রাতের অন্ধকার তখন আরও ঘন হয়ে এসেছে..."></textarea>
    
    <label for="bgmSelect">২. ব্যাকগ্রাউন্ড সাউন্ড ইফেক্ট বেছে নিন:</label>
    <select id="bgmSelect">
      <option value="suspense" selected>রহস্যময় সাসপেন্স মিউজিক (Suspense BGM)</option>
      <option value="rain">ঝুম বৃষ্টির শব্দ (Rain & Thunder)</option>
      <option value="horror">ভূতুড়ে হাওয়া ও শব্দ (Horror Ambience)</option>
      <option value="none">কোনো মিউজিক থাকবে না (Only Voice)</option>
    </select>

    <label for="bgmVolume">৩. ব্যাকগ্রাউন্ড মিউজিক ভলিউম (BGM Volume):</label>
    <input type="range" id="bgmVolume" min="0" max="1" step="0.05" value="0.20">

    <button onclick="generateVoice()">গল্প চালু করুন (Play Story)</button>

    <div id="status" style="margin-top:15px; text-align:center; color:#eccc68;"></div>

    <div class="audio-controls">
      <label>ভয়েস ও মিউজিক প্লেয়ার:</label>
      <audio id="voicePlayer" controls style="width: 100%; display:none;"></audio>
      <audio id="bgmPlayer" loop style="display:none;"></audio>
    </div>
  </div>

  <script>
    // আপনার ElevenLabs API Key যুক্ত করা হলো
    const API_KEY = "sk_f3a5954f9425b78fe2b9fb9d6b148ac13f52d02f74ff23e4";
    const VOICE_ID = "21m00Tcm4TlvDq8ikWAM"; 

    // ব্যাকগ্রাউন্ড মিউজিক লিংক
    const BGM_URLS = {
      suspense: "https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c82a51a8.mp3?filename=dark-suspense-10657.mp3",
      rain: "https://cdn.pixabay.com/download/audio/2022/05/16/audio_db65922370.mp3?filename=rain-and-thunder-112211.mp3",
      horror: "https://cdn.pixabay.com/download/audio/2021/09/06/audio_92429712a7.mp3?filename=scary-spooky-creepy-horror-ambient-10255.mp3"
    };

    const bgmPlayer = document.getElementById('bgmPlayer');
    const bgmVolumeInput = document.getElementById('bgmVolume');

    bgmVolumeInput.addEventListener('input', function() {
      bgmPlayer.volume = this.value;
    });

    async function generateVoice() {
      const text = document.getElementById('scriptText').value;
      const status = document.getElementById('status');
      const voicePlayer = document.getElementById('voicePlayer');
      const selectedBgm = document.getElementById('bgmSelect').value;

      if (!text) {
        alert("দয়া করে কিছু গল্প বা ডায়ালগ লিখুন!");
        return;
      }

      status.innerText = "ভয়েস ও ব্যাকগ্রাউন্ড মিউজিক তৈরি হচ্ছে, অপেক্ষা করুন...";
      voicePlayer.style.display = "none";
      bgmPlayer.pause();

      try {
        const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${VOICE_ID}`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "xi-api-key": API_KEY
          },
          body: JSON.stringify({
            text: text,
            model_id: "eleven_multilingual_v2",
            voice_settings: {
              stability: 0.35,
              similarity_boost: 0.85,
              style: 0.50,
              use_speaker_boost: true
            }
          })
        });

        if (!response.ok) {
          throw new Error("ভয়েস তৈরি করা যায়নি! API Key বা ক্রেডিট চেক করুন।");
        }

        const blob = await response.blob();
        const audioUrl = URL.createObjectURL(blob);

        voicePlayer.src = audioUrl;
        voicePlayer.style.display = "block";

        if (selectedBgm !== "none" && BGM_URLS[selectedBgm]) {
          bgmPlayer.src = BGM_URLS[selectedBgm];
          bgmPlayer.volume = bgmVolumeInput.value;
          bgmPlayer.play();
        }

        voicePlayer.play();
        status.innerText = "গল্প চালু হয়েছে!";

        voicePlayer.onended = function() {
          bgmPlayer.pause();
          status.innerText = "গল্প বলা শেষ হয়েছে।";
        };

      } catch (error) {
        status.innerText = "ত্রুটি: " + error.message;
      }
    }
  </script>
</body>
</html>
