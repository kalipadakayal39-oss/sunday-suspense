<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunday Suspense Super Studio</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #f59e0b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            border: 1px solid var(--border-color);
        }
        h1 {
            text-align: center;
            color: var(--accent-color);
            margin-bottom: 20px;
            font-size: 1.8rem;
        }
        .input-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        textarea, select {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
        }
        textarea:focus, select:focus {
            border-color: var(--accent-color);
        }
        button {
            width: 100%;
            padding: 14px;
            background: var(--accent-color);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 10px;
        }
        button:hover {
            opacity: 0.9;
        }
        button:disabled {
            background: #475569;
            cursor: not-allowed;
        }
        .audio-player {
            margin-top: 20px;
            text-align: center;
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        audio {
            width: 100%;
            margin-top: 10px;
        }
        .status {
            text-align: center;
            margin-top: 15px;
            color: var(--accent-color);
            font-weight: bold;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎙️ Sunday Suspense Studio</h1>

        <div class="input-group">
            <label for="scriptText">গল্প বা স্ক্রিপ্ট লিখুন:</label>
            <textarea id="scriptText" rows="5" placeholder="এখানে আপনার সাসপেন্স গল্প লিখুন..."></textarea>
        </div>

        <div class="input-group">
            <label for="voiceSelect">ভয়েস স্টাইল সিলেক্ট করুন:</label>
            <select id="voiceSelect">
                <option value="alloy">Alloy (সুষম কন্ঠ)</option>
                <option value="echo">Echo (গভীর ও রহস্যময়)</option>
                <option value="fable">Fable (বক্তৃতা স্টাইল)</option>
                <option value="onyx">Onyx (ভারী কন্ঠ)</option>
                <option value="nova">Nova (স্বচ্ছ নারী কন্ঠ)</option>
                <option value="shimmer">Shimmer (নরম কন্ঠ)</option>
            </select>
        </div>

        <button id="generateBtn" onclick="generateAudio()">⚡ ১০ সেকেন্ডে অডিও তৈরি করুন</button>

        <div class="status" id="statusMessage"></div>

        <div class="audio-player" id="playerContainer" style="display:none;">
            <label>আপনার তৈরি করা ভয়েস প্লেয়ার:</label>
            <audio id="audioOutput" controls></audio>
        </div>
    </div>

    <script>
        const API_KEY = "sk_1e4467e497bcd195268f97f295196b2e9256acf43c0ca618";

        async function generateAudio() {
            const text = document.getElementById('scriptText').value.trim();
            const voice = document.getElementById('voiceSelect').value;
            const statusMessage = document.getElementById('statusMessage');
            const playerContainer = document.getElementById('playerContainer');
            const audioOutput = document.getElementById('audioOutput');
            const generateBtn = document.getElementById('generateBtn');

            if (!text) {
                alert('দয়া করে কিছু টেক্সট বা গল্প লিখুন!');
                return;
            }

            generateBtn.disabled = true;
            statusMessage.innerText = '⏳ জেনারেট হচ্ছে, একটু অপেক্ষা করুন...';
            playerContainer.style.display = 'none';

            try {
                const response = await fetch('https://api.openai.com/v1/audio/speech', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'tts-1',
                        input: text,
                        voice: voice
                    })
                });

                if (!response.ok) {
                    throw new Error('সার্ভার থেকে রেসপন্স পেতে সমস্যা হয়েছে।');
                }

                const blob = await response.blob();
                const audioUrl = URL.createObjectURL(blob);
                
                audioOutput.src = audioUrl;
                playerContainer.style.display = 'block';
                statusMessage.innerText = '✅ সফলভাবে অডিও তৈরি হয়ে গেছে!';
                audioOutput.play();
            } catch (error) {
                statusMessage.innerText = '❌ ত্রুটি: ' + error.message;
            } finally {
                generateBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
