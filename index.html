<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunday Suspense Studio - 20 Visuals</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #f59e0b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-primary); min-height: 100vh; padding: 20px 10px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 600px; background: var(--card-bg); padding: 20px; border-radius: 16px; border: 1px solid var(--border-color); box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { text-align: center; color: var(--accent-color); font-size: 22px; margin-bottom: 15px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 14px; color: var(--text-secondary); margin-bottom: 5px; }
        textarea, select { width: 100%; background: #0f172a; border: 1px solid var(--border-color); color: var(--text-primary); padding: 12px; border-radius: 8px; outline: none; }
        textarea { height: 100px; resize: none; }
        .btn-generate { width: 100%; background: var(--accent-color); color: #000; font-weight: bold; border: none; padding: 14px; border-radius: 8px; font-size: 16px; cursor: pointer; }
        .status-msg { text-align: center; margin: 15px 0; font-size: 14px; color: var(--accent-color); }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin-top: 15px; }
        .gallery-card { background: #0f172a; border-radius: 8px; overflow: hidden; border: 1px solid var(--border-color); }
        .gallery-card img { width: 100%; height: 100px; object-fit: cover; display: block; }
        .gallery-card p { font-size: 11px; padding: 5px; color: var(--text-secondary); text-align: center; }
        audio { width: 100%; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sunday Suspense Studio</h1>
        <div class="form-group">
            <label>গল্প বা স্ক্রিপ্ট লিখুন:</label>
            <textarea id="storyInput" placeholder="এখানে আপনার বড় বা ছোট গল্প লিখুন..."></textarea>
        </div>
        <div class="form-group">
            <label>ভয়েস সিলেক্ট করুন:</label>
            <select id="voiceSelect">
                <option value="echo">Echo (গভীর ও রহস্যময়)</option>
                <option value="onyx">Onyx (ভারী কণ্ঠ)</option>
                <option value="alloy">Alloy (সুষম কণ্ঠ)</option>
            </select>
        </div>
        <button class="btn-generate" id="genBtn" onclick="generateStoryAssets()">⚡ ২০টি সিন ফটো ও ভয়েস জেনারেট করুন</button>
        
        <div class="status-msg" id="statusMsg"></div>
        <audio id="audioPlayer" controls style="display:none;"></audio>
        
        <div class="gallery-grid" id="imageGallery"></div>
    </div>

    <script>
        const apiKey = "sk_1e4467e497bcd195268f97f295196b2e9256acf43c0ca618";

        async function generateStoryAssets() {
            const text = document.getElementById('storyInput').value.trim();
            const voice = document.getElementById('voiceSelect').value;
            const statusMsg = document.getElementById('statusMsg');
            const gallery = document.getElementById('imageGallery');
            const audioPlayer = document.getElementById('audioPlayer');
            const btn = document.getElementById('genBtn');

            if (!text) {
                statusMsg.innerText = "❌ অনুগ্রহ করে কিছু গল্প লিখুন!";
                return;
            }

            btn.disabled = true;
            gallery.innerHTML = "";
            statusMsg.innerText = "⏳ গল্প বিশ্লেষণ করে ২০টি ফটো তৈরি করা হচ্ছে...";

            // ২০টি আলাদা সিন তৈরির জন্য লুপ
            for (let i = 1; i <= 20; i++) {
                const promptText = encodeURIComponent(`Cinematic dark suspense horror scene part ${i}, Bengali horror story atmosphere, ${text.slice(0, 50)}`);
                const imgUrl = `https://image.pollinations.ai/prompt/${promptText}?width=400&height=300&nologo=true&seed=${Math.floor(Math.random() * 10000) + i}`;

                const card = document.createElement('div');
                card.className = 'gallery-card';
                card.innerHTML = `
                    <img src="${imgUrl}" alt="Scene ${i}">
                    <p>ফটো #${i}</p>
                `;
                gallery.appendChild(card);
            }

            statusMsg.innerText = "⏳ ফটো তৈরি সম্পন্ন! এবার ভয়েস তৈরি হচ্ছে...";

            // অডিও জেনারেশন
            try {
                const response = await fetch("https://api.openai.com/v1/audio/speech", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${apiKey}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "tts-1",
                        input: text,
                        voice: voice
                    })
                });

                if (response.ok) {
                    const blob = await response.blob();
                    audioPlayer.src = URL.createObjectURL(blob);
                    audioPlayer.style.display = "block";
                    statusMsg.innerText = "✅ ২০টি ফটো এবং অডিও সফলভাবে তৈরি হয়ে গেছে!";
                    audioPlayer.play();
                } else {
                    statusMsg.innerText = "✅ ২০টি ফটো তৈরি হয়ে গেছে! (ভয়েসের জন্য ব্রাউজার সিকিউরিটি পারমিশন প্রয়োজন)";
                }
            } catch (err) {
                statusMsg.innerText = "✅ ২০টি ফটো গ্যালারিতে তৈরি হয়ে গেছে!";
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
                                                                 </html>
