<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunday Suspense Studio</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #f59e0b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-primary); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 16px; }
        .studio-card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; width: 100%; max-width: 420px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .logo-area { text-align: center; margin-bottom: 20px; }
        .logo-area h1 { font-size: 22px; color: var(--accent-color); margin-top: 8px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 14px; color: var(--text-secondary); margin-bottom: 6px; }
        textarea, select { width: 100%; background: #0f172a; border: 1px solid var(--border-color); color: var(--text-primary); padding: 12px; border-radius: 8px; font-size: 14px; outline: none; }
        textarea { height: 110px; resize: none; }
        .btn-generate { width: 100%; background: var(--accent-color); color: #000; font-weight: bold; border: none; padding: 14px; border-radius: 8px; font-size: 16px; cursor: pointer; transition: 0.2s; }
        .btn-generate:hover { opacity: 0.9; }
        .status-msg { text-align: center; margin-top: 12px; font-size: 14px; }
        audio { width: 100%; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="studio-card">
        <div class="logo-area">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v1a7 7 0 0 1-14 0v-1"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
            <h1>Sunday Suspense Studio</h1>
        </div>
        <div class="form-group">
            <label>গল্প বা স্ক্রিপ্ট লিখুন:</label>
            <textarea id="storyInput" placeholder="এখানে আপনার সাসপেন্স গল্প লিখুন..."></textarea>
        </div>
        <div class="form-group">
            <label>ভয়েস স্টাইল সিলেক্ট করুন:</label>
            <select id="voiceSelect">
                <option value="alloy">Alloy (সুষম কণ্ঠ)</option>
                <option value="echo" selected>Echo (গভীর ও রহস্যময়)</option>
                <option value="fable">Fable (বক্তৃতা স্টাইল)</option>
                <option value="onyx">Onyx (ভারী কণ্ঠ)</option>
                <option value="nova">Nova (স্বচ্ছ নারী কণ্ঠ)</option>
                <option value="shimmer">Shimmer (নরম কণ্ঠ)</option>
            </select>
        </div>
        <button class="btn-generate" id="genBtn" onclick="generateAudio()">⚡ ১০ সেকেন্ডে অডিও তৈরি করুন</button>
        <div class="status-msg" id="statusMsg"></div>
        <audio id="audioPlayer" controls style="display:none;"></audio>
    </div>

    <script>
        const apiKey = "sk_1e4467e497bcd195268f97f295196b2e9256acf43c0ca618";

        async function generateAudio() {
            const text = document.getElementById('storyInput').value.trim();
            const voice = document.getElementById('voiceSelect').value;
            const statusMsg = document.getElementById('statusMsg');
            const audioPlayer = document.getElementById('audioPlayer');
            const btn = document.getElementById('genBtn');

            if (!text) {
                statusMsg.style.color = "#ef4444";
                statusMsg.innerText = "❌ প্রথমে কিছু গল্প বা স্ক্রিপ্ট লিখুন!";
                return;
            }

            btn.disabled = true;
            statusMsg.style.color = "#f59e0b";
            statusMsg.innerText = "⏳ ভয়েস তৈরি হচ্ছে, একটু অপেক্ষা করুন...";
            audioPlayer.style.display = "none";

            try {
                // ব্রাউজারের নিজস্ব ব্যাকএন্ড টানেল ব্যবহার করে সরাসরি রিকোয়েস্ট পাঠানোর ব্যবস্থা
                const response = await fetch("https://api.openai.com/v1/audio/speech", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${apiKey}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "tts-1",
                        input: text,
                        voice: voice
                    })
                });

                if (!response.ok) {
                    throw new Error("এপিআই কি অথবা সার্ভারে সংযোগে সমস্যা হয়েছে।");
                }

                const blob = await response.blob();
                const audioUrl = URL.createObjectURL(blob);
                
                audioPlayer.src = audioUrl;
                audioPlayer.style.display = "block";
                statusMsg.style.color = "#22c55e";
                statusMsg.innerText = "✅ অডিও সফলভাবে তৈরি হয়ে গেছে!";
                audioPlayer.play();
            } catch (error) {
                statusMsg.style.color = "#ef4444";
                statusMsg.innerText = "❌ ব্রাউজার সিকিউরিটি রেস্ট্রিকশন! দয়া করে আপনার জেনারেটেড কোডটি লোকাল সার্ভারে রান করুন।";
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
  </html>
